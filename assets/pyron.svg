<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-label="Pyron">
<style>.f{font-family:'Segoe UI',Helvetica,Arial,sans-serif}</style>
<rect x="1" y="1" width="558" height="298" rx="12" fill="#161B22" stroke="#30363D"/>
<rect x="1" y="1" width="6" height="298" rx="3" fill="#3FB6D9"/>
<text x="28" y="40" class="f" font-size="12" font-weight="600" letter-spacing="1.5" fill="#3FB6D9">TERMOGRAFIA · NBR 15866</text>
<text x="28" y="72" class="f" font-size="22" font-weight="700" fill="#E6EDF3">Pyron</text>
<text x="28" y="100" class="f" font-size="14" fill="#8B949E">Lê a temperatura do termograma, acha as peças</text>
<text x="28" y="120" class="f" font-size="14" fill="#8B949E">e classifica a severidade, com laudo em PDF.</text>
<line x1="28" y1="146" x2="532" y2="146" stroke="#30363D"/>
<text x="32" y="210" class="f" font-size="30" font-weight="700" fill="#E6EDF3">0,86</text>
<text x="32" y="236" class="f" font-size="13" fill="#8B949E">mAP50 do detector</text>
<text x="32" y="254" class="f" font-size="13" fill="#8B949E">de para-raios</text>
<line x1="188" y1="170" x2="188" y2="262" stroke="#30363D"/>
<text x="200" y="210" class="f" font-size="30" font-weight="700" fill="#E6EDF3">0,5 °C</text>
<text x="200" y="236" class="f" font-size="13" fill="#8B949E">erro mediano lendo</text>
<text x="200" y="254" class="f" font-size="13" fill="#8B949E">a barra de cores</text>
<line x1="356" y1="170" x2="356" y2="262" stroke="#30363D"/>
<text x="368" y="210" class="f" font-size="30" font-weight="700" fill="#E6EDF3">240 ms</text>
<text x="368" y="236" class="f" font-size="13" fill="#8B949E">por imagem na</text>
<text x="368" y="254" class="f" font-size="13" fill="#8B949E">CPU (INT8)</text>
</svg>